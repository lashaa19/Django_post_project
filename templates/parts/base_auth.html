<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #161a22;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.45);
        }

        .card h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            font-weight: 600;
        }

        .field {
            margin-bottom: 16px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #2a2f3a;
            background: #0f1115;
            color: #ffffff;
            font-size: 14px;
        }

        .field input:focus {
            outline: none;
            border-color: #7aa2ff;
            box-shadow: 0 0 0 1px rgba(122,162,255,0.4);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #7aa2ff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #0f1115;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #9bb5ff;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #8b8f9b;
        }

        .footer a {
            color: #7aa2ff;
            font-weight: 500;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
{% block content %}
{% endblock %}
</body>
</html>
