<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}{% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #e6e6e6;
            padding: 40px;
            line-height: 1.5;
        }

        a {
            color: #7aa2ff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: #161a22;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .card {
            background: #161a22;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.45);
        }

        .card h4 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        /* textarea */
        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #2a2f3a;
            background: #0f1115;
            color: #ffffff;
            font-size: 14px;
            resize: vertical;
        }

        textarea::placeholder { color: #8b8f9b; }

        textarea:focus {
            outline: none;
            border-color: #7aa2ff;
            box-shadow: 0 0 0 1px rgba(122,162,255,0.4);
        }

        /* base buttons */
        .btn {
            padding: 10px 18px;
            border-radius: 12px; /* унифицировали радиус */
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: #7aa2ff;
            color: #0f1115;
        }
        .btn-primary:hover { background: #9bb5ff; }

        .btn-secondary {
            background: transparent;
            color: #8b8f9b;
        }
        .btn-secondary:hover { color: #e6e6e6; }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }

        .error {
            background: #2a1b1b;
            border: 1px solid #5a2a2a;
            color: #ffb4b4;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .unviewed-box{
            background: #161a22;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .unviewed-title{
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .unviewed-subtitle{
            font-size: 12px;
            color: #8b8f9b;
            margin-top: -6px;
            margin-bottom: 14px;
        }

        .unviewed-list{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .unviewed-item{
            display: block;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2a2f3a;
            background: rgba(15, 17, 21, 0.35);
            color: #e6e6e6;
            font-weight: 500;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .unviewed-item:hover{
            transform: translateY(-1px);
            border-color: rgba(122,162,255,0.35);
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
            text-decoration: none; /* чтобы не включалось underline из глобального a:hover */
        }

        .unviewed-item:active{
            transform: translateY(0px);
        }

        /* post */
        .post {
            background: #161a22;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .comment {
            background: rgba(15, 17, 21, 0.35);
            border: 1px solid #2a2f3a;
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            box-shadow: none;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .file-hidden{
            display:none;
        }

        .post-media{
            width: 100%;
            max-width: 100%;
            max-height: 420px;
            display: block;
            margin-top: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: #0f1115;
            border: 1px solid #2a2f3a;
            object-fit: cover;
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
        }

        /* video specifics */
        video.post-media{
            height: auto;
            object-fit: contain; /* чтобы видео не обрезалось */
        }

        /* optional: hover like your banners */
        .post-media:hover{
            transform: scale(1.01);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* attach button */
        .attach-btn{
            height:44px;
            padding:0 16px;
            display:flex;
            align-items:center;
            border-radius:12px;
            border:1px solid #2a2f3a;
            background:#161a22;
            color:#e6e6e6;
            font-weight:600;
            cursor:pointer;
            transition:all 0.2s ease;
            white-space:nowrap;
        }

        .attach-btn:hover{
            border-color:#7aa2ff;
            color:#7aa2ff;
            background:rgba(122,162,255,0.08);
        }

        .attach-btn:active{
            transform:translateY(1px);
        }

        /* filename text */
        .file-name{
            font-size:12px;
            color:#8b8f9b;
            align-self:center;
            max-width:140px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .comment:hover {
            transform: translateY(-1px);
            border-color: rgba(122,162,255,0.35);
        }

        .post-author {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .post-text {
            font-size: 15px;
            line-height: 1.6;
            color: #d6d6d6;
            margin-bottom: 14px;
        }

        .post-date {
            font-size: 12px;
            color: #8b8f9b;
        }

        .post-banner {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 12px;
            margin-bottom: 12px;

            box-shadow: 0 8px 18px rgba(0,0,0,0.35);

            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .post-banner:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        .comment-form {
            display: flex;
            gap: 12px;
            align-items: stretch;
            margin-bottom: 14px;
        }

        .comment-form .comment {
            flex: 1;
            height: 44px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2a2f3a;
            background: #0f1115;
            color: #ffffff;
            font-size: 14px;
        }

        .comment-form .comment::placeholder { color: #8b8f9b; }

        .comment-form .comment:focus {
            outline: none;
            border-color: #7aa2ff;
            box-shadow: 0 0 0 1px rgba(122,162,255,0.4);
        }

        .comment-form .btn {
            height: 44px;
            padding: 0 20px;
            border-radius: 12px;
            background: #7aa2ff;
            color: #0f1115;
            font-size: 14px;
            font-weight: 600;
            border: none;
            white-space: nowrap;
        }

        .comment-form .btn:hover { background: #9bb5ff; }

        /* likes */
        .post-actions { margin-top: 12px; }

        .like-form {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .like-btn {
            background: transparent;
            border: 1px solid #2a2f3a;
            color: #8b8f9b;
            padding: 6px 16px;
            border-radius: 12px; /* унифицировали */
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .like-btn:hover {
            border-color: #7aa2ff;
            color: #7aa2ff;
            background: rgba(122,162,255,0.08);
        }

        .like-btn.liked {
            background: #7aa2ff;
            border-color: #7aa2ff;
            color: #0f1115;
        }

        .like-count {
            font-size: 13px;
            color: #8b8f9b;
        }
    </style>
</head>

<body>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
